<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const titel = document.getElementById('afTitel'), tekst = document.getElementById('afTekst');
  const token = new URLSearchParams(location.search).get('t');
  const fejl = 'Skriv til <a href="mailto:dymorte24@gmail.com">dymorte24@gmail.com</a>, så afmelder vi dig med det samme.';
  if (!token || !/^[0-9a-f-]{36}$/i.test(token)){ titel.textContent = 'Linket virker ikke'; tekst.innerHTML = 'Vi kunne ikke læse afmeldingslinket. ' + fejl; return; }
  const db = supabase.createClient('https://xeosltdpvkcaudiijtge.supabase.co', 'sb_publishable_iG0iWu8szH_7-uwErdxN9g_pE9YGFWd');
  const { data, error } = await db.rpc('afmeld_nyhedsbrev', { p_token: token });
  if (error || !data){ titel.textContent = 'Noget gik galt'; tekst.innerHTML = 'Vi kunne ikke finde din tilmelding. ' + fejl; return; }
  titel.textContent = 'Du er afmeldt';
  tekst.textContent = 'Du får ikke flere mails fra findbilplejere.dk. Fortryder du, kan du altid skrive dig op igen på forsiden.';
})();
</script>
