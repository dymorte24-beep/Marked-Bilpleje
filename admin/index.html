<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Bilpleje.dk</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body{background:var(--fog);}
  .admin-wrap{max-width:1000px; margin:0 auto; padding:40px 24px;}
  .admin-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .admin-header h1{color:var(--navy); font-size:26px;}
  .login-box{max-width:360px; margin:80px auto; background:#fff; border-radius:10px; padding:32px; border:1px solid var(--chrome-line);}
  .login-box h2{color:var(--navy); margin-bottom:20px;}
  .login-box input, .pw-box input{width:100%; padding:10px 12px; margin-bottom:12px; border:1px solid var(--chrome-line); border-radius:6px; font-size:15px; box-sizing:border-box;}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; margin-bottom:32px; box-shadow:0 1px 2px rgba(0,0,0,0.04);}
  th, td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--chrome-line); font-size:14px;}
  th{background:var(--navy); color:#fff; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.03em;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600;}
  .badge.betalt{background:#FFFBF2; color:#8A6D1D; border:1px solid var(--gold);}
  .badge.gratis{background:var(--fog); color:#6B7280;}
  .badge.yes{background:#E7F7EE; color:#1A7F4E;}
  .badge.no{background:#FBEAEA; color:#B3261E;}
  .error-msg{color:#B3261E; font-size:13px; margin-top:4px; min-height:16px;}
  .section-title{font-size:20px; font-weight:700; color:var(--navy); margin:32px 0 16px;}
  .logout-btn{background:none; border:1px solid var(--chrome-line); padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px;}
  .pw-toggle{background:none; border:none; color:var(--navy); text-decoration:underline; font-size:13px; cursor:pointer; padding:0; margin-bottom:24px;}
  .pw-box{max-width:360px; background:#fff; border:1px solid var(--chrome-line); border-radius:10px; padding:20px; margin-bottom:24px; display:none;}
  .empty-row td{text-align:center; color:#6B7280; padding:20px;}
</style>
</head>
<body>

<div id="loginView" class="admin-wrap" style="display:none;">
  <div class="login-box">
    <h2>Admin login</h2>
    <input type="email" id="loginEmail" placeholder="Mail" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Adgangskode" autocomplete="current-password">
    <button class="btn-primary" style="width:100%;" onclick="login()">Log ind</button>
    <p class="error-msg" id="loginError"></p>
  </div>
</div>

<div id="dashboardView" class="admin-wrap" style="display:none;">
  <div class="admin-header">
    <h1>Admin-panel</h1>
    <button class="logout-btn" onclick="logout()">Log ud</button>
  </div>
  <button class="pw-toggle" onclick="togglePwBox()">Skift adgangskode</button>
  <div class="pw-box" id="pwBox">
    <input type="password" id="newPassword" placeholder="Ny adgangskode" autocomplete="new-password">
    <button class="btn-primary" onclick="setPassword()">Gem adgangskode</button>
    <p class="error-msg" id="pwError"></p>
  </div>

  <div class="section-title">Butikker</div>
  <table>
    <thead><tr><th>Navn</th><th>By</th><th>Tier</th><th>Verificeret</th><th>Godkendt</th></tr></thead>
    <tbody id="shopsTable"><tr class="empty-row"><td colspan="5">Henter…</td></tr></tbody>
  </table>

  <div class="section-title">Tilbudsforespørgsler</div>
  <table>
    <thead><tr><th>Dato</th><th>Butik</th><th>Navn</th><th>Kontakt</th><th>Besked</th></tr></thead>
    <tbody id="leadsTable"><tr class="empty-row"><td colspan="5">Henter…</td></tr></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://xeosltdpvkcaudiijtge.supabase.co';
const SUPABASE_KEY = 'sb_publishable_iG0iWu8szH_7-uwErdxN9g_pE9YGFWd';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showDashboard(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'block';
  loadDashboard();
}

function showLogin(){
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('dashboardView').style.display = 'none';
}

function togglePwBox(){
  const box = document.getElementById('pwBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

async function login(){
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('loginError').textContent = 'Forkert mail eller adgangskode.';
    return;
  }
  showDashboard();
}

async function logout(){
  await db.auth.signOut();
  showLogin();
}

async function setPassword(){
  const password = document.getElementById('newPassword').value;
  const errEl = document.getElementById('pwError');
  if (password.length < 8) {
    errEl.textContent = 'Adgangskoden skal være mindst 8 tegn.';
    return;
  }
  const { error } = await db.auth.updateUser({ password });
  if (error) {
    errEl.textContent = 'Kunne ikke gemme adgangskoden. Prøv igen.';
    return;
  }
  errEl.style.color = '#1A7F4E';
  errEl.textContent = 'Adgangskode gemt.';
}

function yesNoBadge(value){
  return value ? '<span class="badge yes">Ja</span>' : '<span class="badge no">Nej</span>';
}

async function loadDashboard(){
  const { data: shops, error: shopsError } = await db.from('shops').select('*').order('name');
  const shopsTable = document.getElementById('shopsTable');
  if (shopsError) {
    shopsTable.innerHTML = `<tr class="empty-row"><td colspan="5">Kunne ikke hente butikker.</td></tr>`;
  } else {
    shopsTable.innerHTML = shops.length ? shops.map(s => `
      <tr>
        <td>${s.name}</td>
        <td>${s.city}</td>
        <td><span class="badge ${s.tier}">${s.tier}</span></td>
        <td>${yesNoBadge(s.verificeret)}</td>
        <td>${yesNoBadge(s.godkendt)}</td>
      </tr>
    `).join('') : '<tr class="empty-row"><td colspan="5">Ingen butikker endnu.</td></tr>';
  }

  const { data: leads, error: leadsError } = await db.from('tilbud_anmodninger').select('*').order('created_at', { ascending: false });
  const leadsTable = document.getElementById('leadsTable');
  if (leadsError) {
    leadsTable.innerHTML = `<tr class="empty-row"><td colspan="5">Kunne ikke hente forespørgsler.</td></tr>`;
  } else {
    leadsTable.innerHTML = leads.length ? leads.map(l => `
      <tr>
        <td>${new Date(l.created_at).toLocaleDateString('da-DK')}</td>
        <td>${l.butik || '–'}</td>
        <td>${l.navn}</td>
        <td>${l.kontakt}</td>
        <td>${l.besked || '–'}</td>
      </tr>
    `).join('') : '<tr class="empty-row"><td colspan="5">Ingen forespørgsler endnu.</td></tr>';
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (session) showDashboard(); else showLogin();
});

db.auth.getSession().then(({ data: { session } }) => {
  if (session) showDashboard(); else showLogin();
});
</script>

</body>
</html>
