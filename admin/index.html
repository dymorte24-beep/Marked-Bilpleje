<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Bilpleje.dk</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body{background:var(--fog);}
  .admin-wrap{max-width:1000px; margin:0 auto; padding:40px 24px;}
  .admin-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .admin-header h1{color:var(--navy); font-size:26px;}
  .login-box{max-width:360px; margin:80px auto; background:#fff; border-radius:10px; padding:32px; border:1px solid var(--chrome-line);}
  .login-box h2{color:var(--navy); margin-bottom:20px;}
  .login-box input, .pw-box input{width:100%; padding:10px 12px; margin-bottom:12px; border:1px solid var(--chrome-line); border-radius:6px; font-size:15px; box-sizing:border-box;}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; margin-bottom:32px; box-shadow:0 1px 2px rgba(0,0,0,0.04);}
  th, td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--chrome-line); font-size:14px;}
  th{background:var(--navy); color:#fff; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.03em;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600;}
  .badge.betalt{background:#FFFBF2; color:#8A6D1D; border:1px solid var(--gold);}
  .badge.gratis{background:var(--fog); color:#6B7280;}
  .badge.yes{background:#E7F7EE; color:#1A7F4E;}
  .badge.no{background:#FBEAEA; color:#B3261E;}
  .error-msg{color:#B3261E; font-size:13px; margin-top:4px; min-height:16px;}
  .section-title{font-size:20px; font-weight:700; color:var(--navy); margin:32px 0 16px;}
  .logout-btn{background:none; border:1px solid var(--chrome-line); padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px;}
  .pw-toggle{background:none; border:none; color:var(--navy); text-decoration:underline; font-size:13px; cursor:pointer; padding:0; margin-bottom:24px;}
  .pw-box{max-width:360px; background:#fff; border:1px solid var(--chrome-line); border-radius:10px; padding:20px; margin-bottom:24px; display:none;}
  .empty-row td{text-align:center; color:#6B7280; padding:20px;}
  .shop-toggle{background:var(--navy); color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; margin-bottom:16px;}
  .shop-box{max-width:460px; background:#fff; border:1px solid var(--chrome-line); border-radius:10px; padding:20px; margin-bottom:24px; display:none;}
  .shop-box label{display:block; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:4px; margin-top:12px;}
  .shop-box label:first-child{margin-top:0;}
  .shop-box input[type="text"], .shop-box input[type="number"], .shop-box select{width:100%; padding:10px 12px; border:1px solid var(--chrome-line); border-radius:6px; font-size:15px; box-sizing:border-box;}
  .checkbox-row{display:flex; flex-wrap:wrap; gap:12px; margin-top:4px;}
  .checkbox-row label{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:400; margin:0;}
  .checkbox-row input{width:auto;}
  .inline-check{display:flex; align-items:center; gap:8px; margin-top:14px;}
  .inline-check label{margin:0; font-weight:400; font-size:14px;}
  .delete-btn{background:none; border:1px solid #B3261E; color:#B3261E; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;}
  .delete-btn:hover{background:#FBEAEA;}
  .action-btn{background:none; border:1px solid var(--chrome-line); color:var(--navy); padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; margin-right:6px;}
  .action-btn:hover{background:var(--fog);}
  .actions-cell{white-space:nowrap;}
  .contact-row td{background:var(--fog); font-size:13px;}
  .forward-btn{background:none; border:1px solid var(--chrome-line); color:#6B7280; padding:5px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; white-space:nowrap;}
  .forward-btn:hover{background:var(--fog);}
  .forward-btn.is-forwarded{background:#E7F7EE; border-color:#1A7F4E; color:#1A7F4E;}
</style>
</head>
<body>

<div id="loginView" class="admin-wrap" style="display:none;">
  <div class="login-box">
    <h2>Admin login</h2>
    <input type="email" id="loginEmail" placeholder="Mail" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Adgangskode" autocomplete="current-password">
    <button class="btn-primary" style="width:100%;" onclick="login()">Log ind</button>
    <p class="error-msg" id="loginError"></p>
  </div>
</div>

<div id="dashboardView" class="admin-wrap" style="display:none;">
  <div class="admin-header">
    <h1>Admin-panel</h1>
    <button class="logout-btn" onclick="logout()">Log ud</button>
  </div>
  <button class="pw-toggle" onclick="togglePwBox()">Skift adgangskode</button>
  <div class="pw-box" id="pwBox">
    <input type="password" id="newPassword" placeholder="Ny adgangskode" autocomplete="new-password">
    <button class="btn-primary" onclick="setPassword()">Gem adgangskode</button>
    <p class="error-msg" id="pwError"></p>
  </div>

  <div class="section-title">Butikker</div>
  <button class="shop-toggle" onclick="toggleShopBox()">+ Opret ny butik</button>
  <div class="shop-box" id="shopBox">
    <h3 id="shopBoxTitle" style="color:var(--navy); margin-bottom:4px;">Opret ny butik</h3>
    <input type="hidden" id="editingShopId">
    <label for="newShopName">Navn</label>
    <input type="text" id="newShopName">

    <label for="newShopCity">By</label>
    <input type="text" id="newShopCity" placeholder="Fx Aarhus C" oninput="updateCityKey()">

    <label for="newShopCityKey">By-nøgle (udfyldes automatisk — tjek den er rigtig)</label>
    <input type="text" id="newShopCityKey">

    <label>Ydelser</label>
    <div class="checkbox-row">
      <label><input type="checkbox" class="service-check" value="Keramisk coating"> Keramisk coating</label>
      <label><input type="checkbox" class="service-check" value="Polering"> Polering</label>
      <label><input type="checkbox" class="service-check" value="Folie"> Folie</label>
      <label><input type="checkbox" class="service-check" value="Indvendig rens"> Indvendig rens</label>
      <label><input type="checkbox" class="service-check" value="Udvendig rens"> Udvendig rens</label>
      <label><input type="checkbox" class="service-check" value="Lakforsegling/voks"> Lakforsegling/voks</label>
      <label><input type="checkbox" class="service-check" value="Sæderens"> Sæderens</label>
      <label><input type="checkbox" class="service-check" value="Hjulskift"> Hjulskift</label>
      <label><input type="checkbox" class="service-check" value="Mobil bilpleje"> Mobil bilpleje</label>
      <label><input type="checkbox" class="service-check" value="Detailing"> Detailing</label>
      <label><input type="checkbox" class="service-check" value="Ventilationsrens"> Ventilationsrens</label>
      <label><input type="checkbox" class="service-check" value="Ozonbehandling"> Ozonbehandling</label>
      <label><input type="checkbox" class="service-check" value="Damprens"> Damprens</label>
      <label><input type="checkbox" class="service-check" value="Læderpleje"> Læderpleje</label>
      <label><input type="checkbox" class="service-check" value="Solfilm"> Solfilm</label>
    </div>

    <label for="newShopPrice">Pris fra (kr.) — valgfri, hvis ikke oplyst</label>
    <input type="number" id="newShopPrice" min="0">

    <label for="newShopDiscount">Rabat (%) — valgfri, vises kun hvis udfyldt</label>
    <input type="number" id="newShopDiscount" min="0" max="100">

    <label for="newShopContactPerson">Kontaktperson — valgfri, kun synlig i panelet</label>
    <input type="text" id="newShopContactPerson">

    <label for="newShopPhone">Telefon — valgfri, kun synlig i panelet</label>
    <input type="text" id="newShopPhone">

    <label for="newShopEmail">Mail — valgfri, kun synlig i panelet</label>
    <input type="email" id="newShopEmail">

    <label for="newShopTier">Tier</label>
    <select id="newShopTier">
      <option value="gratis">Gratis</option>
      <option value="betalt">Betalt</option>
    </select>

    <div class="inline-check">
      <input type="checkbox" id="newShopVerified">
      <label for="newShopVerified">Verificeret (sæt kun, hvis du selv har bekræftet butikken er ægte)</label>
    </div>

    <button class="btn-primary" style="width:100%; margin-top:16px;" onclick="saveShop()" id="shopSaveBtn">Opret butik</button>
    <p class="error-msg" id="shopError"></p>
  </div>
  <table>
    <thead><tr><th>Navn</th><th>By</th><th>Tier</th><th>Rabat</th><th>Verificeret</th><th>Godkendt</th><th></th></tr></thead>
    <tbody id="shopsTable"><tr class="empty-row"><td colspan="7">Henter…</td></tr></tbody>
  </table>

  <div class="section-title">Tilbudsforespørgsler</div>
  <table>
    <thead><tr><th>Dato</th><th>Butik</th><th>Navn</th><th>Kontakt</th><th>Besked</th><th>Videresendt</th></tr></thead>
    <tbody id="leadsTable"><tr class="empty-row"><td colspan="6">Henter…</td></tr></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://xeosltdpvkcaudiijtge.supabase.co';
const SUPABASE_KEY = 'sb_publishable_iG0iWu8szH_7-uwErdxN9g_pE9YGFWd';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showDashboard(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'block';
  loadDashboard();
}

function showLogin(){
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('dashboardView').style.display = 'none';
}

function togglePwBox(){
  const box = document.getElementById('pwBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

async function login(){
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('loginError').textContent = 'Forkert mail eller adgangskode.';
    return;
  }
  showDashboard();
}

async function logout(){
  await db.auth.signOut();
  showLogin();
}

async function setPassword(){
  const password = document.getElementById('newPassword').value;
  const errEl = document.getElementById('pwError');
  if (password.length < 8) {
    errEl.textContent = 'Adgangskoden skal være mindst 8 tegn.';
    return;
  }
  const { error } = await db.auth.updateUser({ password });
  if (error) {
    errEl.textContent = 'Kunne ikke gemme adgangskoden. Prøv igen.';
    return;
  }
  errEl.style.color = '#1A7F4E';
  errEl.textContent = 'Adgangskode gemt.';
}

function resetShopForm(){
  document.getElementById('editingShopId').value = '';
  document.getElementById('newShopName').value = '';
  document.getElementById('newShopCity').value = '';
  document.getElementById('newShopCityKey').value = '';
  document.querySelectorAll('.service-check').forEach(c => c.checked = false);
  document.getElementById('newShopPrice').value = '';
  document.getElementById('newShopDiscount').value = '';
  document.getElementById('newShopContactPerson').value = '';
  document.getElementById('newShopPhone').value = '';
  document.getElementById('newShopEmail').value = '';
  document.getElementById('newShopTier').value = 'gratis';
  document.getElementById('newShopVerified').checked = false;
  document.getElementById('shopBoxTitle').textContent = 'Opret ny butik';
  document.getElementById('shopSaveBtn').textContent = 'Opret butik';
  document.getElementById('shopError').textContent = '';
}

function toggleShopBox(){
  resetShopForm();
  const box = document.getElementById('shopBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

function openEditBox(id){
  const shop = currentShops.find(s => s.id === id);
  if (!shop) return;
  document.getElementById('editingShopId').value = shop.id;
  document.getElementById('newShopName').value = shop.name;
  document.getElementById('newShopCity').value = shop.city;
  document.getElementById('newShopCityKey').value = shop.city_key;
  document.querySelectorAll('.service-check').forEach(c => { c.checked = shop.services.includes(c.value); });
  document.getElementById('newShopPrice').value = shop.price_from || '';
  document.getElementById('newShopDiscount').value = shop.discount || '';
  document.getElementById('newShopContactPerson').value = shop.contact_person || '';
  document.getElementById('newShopPhone').value = shop.phone || '';
  document.getElementById('newShopEmail').value = shop.email || '';
  document.getElementById('newShopTier').value = shop.tier;
  document.getElementById('newShopVerified').checked = shop.verificeret;
  document.getElementById('shopBoxTitle').textContent = 'Rediger ' + shop.name;
  document.getElementById('shopSaveBtn').textContent = 'Gem ændringer';
  document.getElementById('shopError').textContent = '';
  document.getElementById('shopBox').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleContact(id){
  const row = document.getElementById('contact-' + id);
  if (row) row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
}

function slugify(text){
  return text.toLowerCase()
    .replace(/æ/g,'e').replace(/ø/g,'o').replace(/å/g,'a')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
}

function updateCityKey(){
  const city = document.getElementById('newShopCity').value.trim();
  const firstWord = city.split(' ')[0] || '';
  document.getElementById('newShopCityKey').value = slugify(firstWord);
}

async function saveShop(){
  const editingId = document.getElementById('editingShopId').value;
  const name = document.getElementById('newShopName').value.trim();
  const city = document.getElementById('newShopCity').value.trim();
  const cityKey = document.getElementById('newShopCityKey').value.trim();
  const services = Array.from(document.querySelectorAll('.service-check:checked')).map(c => c.value);
  const priceRaw = document.getElementById('newShopPrice').value.trim();
  const priceFrom = priceRaw ? parseInt(priceRaw, 10) : null;
  const discountRaw = document.getElementById('newShopDiscount').value.trim();
  const discount = discountRaw ? parseInt(discountRaw, 10) : null;
  const contactPerson = document.getElementById('newShopContactPerson').value.trim() || null;
  const phone = document.getElementById('newShopPhone').value.trim() || null;
  const email = document.getElementById('newShopEmail').value.trim() || null;
  const tier = document.getElementById('newShopTier').value;
  const verificeret = document.getElementById('newShopVerified').checked;
  const errEl = document.getElementById('shopError');

  if (!name || !city || !cityKey || services.length === 0) {
    errEl.style.color = '#B3261E';
    errEl.textContent = 'Udfyld navn, by og mindst én ydelse.';
    return;
  }

  const shopData = {
    name, city, city_key: cityKey, services, price_from: priceFrom,
    discount, contact_person: contactPerson, phone, email,
    tier, verificeret
  };

  let error;
  if (editingId) {
    ({ error } = await db.from('shops').update(shopData).eq('id', editingId));
  } else {
    shopData.godkendt = true;
    shopData.profile_url = `bilpleje/${cityKey}/${slugify(name)}/`;
    ({ error } = await db.from('shops').insert(shopData));
  }

  if (error) {
    errEl.style.color = '#B3261E';
    errEl.textContent = 'Kunne ikke gemme butikken. Prøv igen.';
    return;
  }

  const wasEditing = !!editingId;
  resetShopForm();
  errEl.style.color = '#1A7F4E';
  errEl.textContent = wasEditing ? 'Ændringer gemt!' : 'Butik oprettet!';
  loadDashboard();
}

let currentShops = [];

async function deleteShop(id, name){
  if (!confirm(`Slet "${name}"? Det kan ikke fortrydes.`)) return;
  const { error } = await db.from('shops').delete().eq('id', id);
  if (error) {
    alert('Kunne ikke slette butikken. Prøv igen.');
    return;
  }
  loadDashboard();
}

function yesNoBadge(value){
  return value ? '<span class="badge yes">Ja</span>' : '<span class="badge no">Nej</span>';
}

async function loadDashboard(){
  const { data: shops, error: shopsError } = await db.from('shops').select('*').order('name');
  const shopsTable = document.getElementById('shopsTable');
  currentShops = shops || [];
  if (shopsError) {
    shopsTable.innerHTML = `<tr class="empty-row"><td colspan="7">Kunne ikke hente butikker.</td></tr>`;
  } else {
    shopsTable.innerHTML = shops.length ? shops.map(s => `
      <tr>
        <td>${s.name}</td>
        <td>${s.city}</td>
        <td><span class="badge ${s.tier}">${s.tier}</span></td>
        <td>${s.discount ? s.discount + '%' : '–'}</td>
        <td>${yesNoBadge(s.verificeret)}</td>
        <td>${yesNoBadge(s.godkendt)}</td>
        <td class="actions-cell">
          <button class="action-btn" onclick="toggleContact('${s.id}')">Kontakt</button>
          <button class="action-btn" onclick="openEditBox('${s.id}')">Rediger</button>
          <button class="delete-btn" onclick="deleteShop('${s.id}', '${s.name.replace(/'/g, "\\'")}')">Slet</button>
        </td>
      </tr>
      <tr class="contact-row" id="contact-${s.id}" style="display:none;">
        <td colspan="7"><strong>Kontakt:</strong> ${s.contact_person || '–'} · ${s.phone || '–'} · ${s.email || '–'}</td>
      </tr>
    `).join('') : '<tr class="empty-row"><td colspan="7">Ingen butikker endnu.</td></tr>';
  }

  const { data: leads, error: leadsError } = await db.from('tilbud_anmodninger').select('*').order('created_at', { ascending: false });
  const leadsTable = document.getElementById('leadsTable');
  if (leadsError) {
    leadsTable.innerHTML = `<tr class="empty-row"><td colspan="6">Kunne ikke hente forespørgsler.</td></tr>`;
  } else {
    leadsTable.innerHTML = leads.length ? leads.map(l => `
      <tr>
        <td>${new Date(l.created_at).toLocaleDateString('da-DK')}</td>
        <td>${l.butik || '–'}</td>
        <td>${l.navn}</td>
        <td>${l.kontakt}</td>
        <td>${l.besked || '–'}</td>
        <td>
          <button class="forward-btn ${l.videresendt ? 'is-forwarded' : ''}" onclick="toggleForwarded('${l.id}', ${l.videresendt})">
            ${l.videresendt ? '✓ Videresendt' : 'Marker som sendt'}
          </button>
        </td>
      </tr>
    `).join('') : '<tr class="empty-row"><td colspan="6">Ingen forespørgsler endnu.</td></tr>';
  }
}

async function toggleForwarded(id, current){
  const { error } = await db.from('tilbud_anmodninger').update({ videresendt: !current }).eq('id', id);
  if (error) {
    alert('Kunne ikke opdatere status. Prøv igen.');
    return;
  }
  loadDashboard();
}

db.auth.onAuthStateChange((event, session) => {
  if (session) showDashboard(); else showLogin();
});

db.auth.getSession().then(({ data: { session } }) => {
  if (session) showDashboard(); else showLogin();
});
</script>

</body>
</html>
