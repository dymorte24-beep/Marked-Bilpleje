<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilpleje-butik | Bilpleje.dk</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../css/style.css">
</head>
<body>

<nav>
  <div class="wrap">
    <a href="../../../index.html" class="logo">bilpleje<span>.dk</span></a>
    <div class="nav-links">
      <a href="../../../index.html#search">Find en butik</a>
      <a href="../../../index.html#shops">For butikker</a>
    </div>
    <a href="../../../index.html#shops" class="nav-cta">Bliv listet</a>
  </div>
</nav>

<section class="seo-page">
  <div class="wrap">
    <div class="breadcrumb" id="breadcrumb">
      <a href="../../../index.html">Forside</a><span class="sep">/</span>Bilpleje
    </div>

    <div id="shopContent">
      <p class="intro">Henter…</p>
    </div>
  </div>
</section>

<footer>
  <a href="../../../privatlivspolitik.html">Privatlivspolitik</a> · bilpleje.dk — prototype
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://xeosltdpvkcaudiijtge.supabase.co';
const SUPABASE_KEY = 'sb_publishable_iG0iWu8szH_7-uwErdxN9g_pE9YGFWd';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadShop(){
  const path = window.location.pathname.replace(/^\//, '');
  const { data: shop, error } = await db.from('shops').select('*').eq('profile_url', path).eq('godkendt', true).maybeSingle();

  const content = document.getElementById('shopContent');
  const breadcrumb = document.getElementById('breadcrumb');

  if (error || !shop) {
    content.innerHTML = '<p class="intro">Denne butiksprofil findes ikke (længere).</p>';
    return;
  }

  document.title = shop.name + ' | Bilpleje.dk';
  breadcrumb.innerHTML = `
    <a href="/index.html">Forside</a><span class="sep">/</span>
    <a href="/bilpleje/${shop.city_key}/">${shop.city}</a><span class="sep">/</span>${shop.name}
  `;

  content.innerHTML = `
    <h1>${shop.name}</h1>
    <p class="intro">${shop.city} · ${shop.services.join(', ')}</p>
    <div class="card-tags" style="margin-bottom:20px;">
      ${shop.verificeret ? `<span class="pill verified">Verificeret</span>` : ''}
      ${shop.price_from ? `<span class="pill">Fra ${shop.price_from} kr.</span>` : ''}
      ${shop.discount ? `<span class="pill discount">${shop.discount}% rabat</span>` : ''}
    </div>
    <a href="../../../index.html#search"><button class="btn-primary">Få tilbud fra ${shop.name}</button></a>
  `;
}
loadShop();
</script>

</body>
</html>
