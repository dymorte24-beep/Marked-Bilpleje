<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18378049298"></script>

<title>Bilpleje-butik | FindBilplejere.dk</title>
<meta name="description" content="Se priser, ydelser og få tilbud direkte fra denne bilpleje-butik." id="metaDescription">
<meta property="og:image" content="https://findbilplejere.dk/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../css/style.css">
<style>
  body.has-sticky-cta{padding-bottom:0;}
  .pf-wrap{ --section-gap:72px; --section-pad:40px; }
  @media (max-width:760px){
    .pf-wrap{ --section-gap:40px; --section-pad:20px; }
  }
  /* Desktop/tablet only: profile pages get a much wider column than the sitewide
     900px .seo-page default. Scoped to .seo-page .pf-wrap (only exists on this
     page) so by.html/index.html, which share the global .seo-page rule, are untouched. */
  @media (min-width:761px){
    .seo-page .pf-wrap{ width:90%; max-width:1320px; }
  }
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  /* TWO-COLUMN PRIMITIVE (hero + about) */
  .pf-split{display:grid; grid-template-columns:1fr 1fr; gap:48px;}
  @media (max-width:760px){
    .pf-split{grid-template-columns:1fr; gap:24px;}
  }

  /* HERO */
  .pf-hero{padding:8px 0 0;}
  .pf-hero-grid{align-items:center;}
  .pf-hero-main{display:flex; flex-direction:column;}
  .pf-eyebrow{
    color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:12px;
    letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px;
  }
  h1.pf-name{font-size:52px; line-height:1.05; margin-bottom:14px;}
  .pf-location{color:var(--text-muted); font-size:16px; margin-bottom:14px;}
  .pf-stars-row{margin-bottom:14px;}
  .pf-stars{color:var(--gold); font-size:20px; letter-spacing:3px;}
  .pf-tagline{color:var(--text-muted); font-size:17px; font-style:italic; line-height:1.5;}

  .pf-hero-media{display:flex; flex-direction:column; gap:14px;}
  .pf-hero-img, .pf-hero-fallback{
    width:100%; aspect-ratio:4/3; object-fit:contain; border-radius:16px;
    border:1px solid var(--chrome-line); background:var(--navy); display:block;
  }
  .pf-hero-fallback{display:flex; align-items:center; justify-content:center;}
  .pf-hero-fallback svg{width:56px; height:56px; color:var(--gold); opacity:0.8;}
  .pf-cta-primary{width:100%; font-size:16px; padding:16px; margin:0;}
  .pf-secondary-actions{display:flex; flex-wrap:wrap; gap:10px;}
  .pf-secondary-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--white); border:1px solid var(--chrome-line); color:var(--navy);
    padding:9px 16px; border-radius:24px; font-size:13px; font-weight:600;
    transition:border-color 160ms var(--ease-out), background 160ms var(--ease-out);
  }
  .pf-secondary-btn:hover{border-color:var(--gold); background:var(--gold-light);}
  .pf-secondary-btn svg{width:15px; height:15px;}

  @media (max-width:760px){
    .pf-hero-main{text-align:center;}
    h1.pf-name{font-size:32px;}
    .pf-secondary-actions{justify-content:center;}
  }

  /* STICKY MOBILE CTA */
  .pf-sticky-cta{display:none;}
  @media (max-width:760px){
    .pf-sticky-cta{
      display:block; position:fixed; left:0; right:0; bottom:0; z-index:500;
      background:var(--white); border-top:1px solid var(--chrome-line);
      padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      box-shadow:0 -4px 16px rgba(16,24,40,0.10);
    }
    .pf-sticky-cta button{width:100%; margin:0;}
    body.has-sticky-cta{padding-bottom:78px;}
  }

  /* SECTIONS */
  .profile-section{margin-top:var(--section-gap); padding-top:var(--section-pad); border-top:1px solid var(--chrome-line);}
  .profile-section h2{font-size:18px; margin-bottom:14px;}

  /* ABOUT (pf-split-top is reused below for the services+price and reviews+info pairs) */
  .pf-about-grid, .pf-split-top{align-items:start;}
  h2.pf-about-headline{font-size:36px; line-height:1.18; margin:0;}
  h2.pf-about-label{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--gold-dark); margin:0;
  }
  .pf-about-text{color:var(--text-muted); line-height:1.7; font-size:16px; max-width:640px;}
  .pf-about-text.is-clamped{display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden;}
  .pf-readmore{color:var(--gold-dark); font-weight:600; font-size:14px; cursor:pointer; margin-top:8px; display:inline-block; background:none; border:none; padding:0; font-family:inherit;}
  @media (max-width:760px){
    h2.pf-about-headline{font-size:26px;}
  }

  /* STATS */
  .pf-stats{display:flex; flex-wrap:wrap; gap:36px 56px;}
  .pf-stat{display:flex; flex-direction:column; gap:6px;}
  .pf-stat-value{font-family:'Oswald',sans-serif; font-size:40px; font-weight:600; color:var(--navy); line-height:1;}
  .pf-stat-label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-muted);}
  @media (min-width:761px){
    .pf-stat + .pf-stat{border-left:1px solid var(--chrome-line); padding-left:40px;}
  }

  /* SERVICES */
  .pf-services{columns:260px 2; column-gap:40px; list-style:none; margin:0; padding:0;}
  .pf-service-row{display:flex; align-items:baseline; gap:10px; padding:9px 0; break-inside:avoid; -webkit-column-break-inside:avoid;}
  .pf-service-row::before{content:"–"; color:var(--gold); font-weight:700; flex-shrink:0;}
  .pf-service-name{font-size:15px; color:var(--navy);}
  @media (max-width:760px){ .pf-services{columns:1;} }

  /* HVORFOR VÆLGE OS */
  .pf-why{display:grid; grid-template-columns:1fr 1fr; gap:10px 32px;}
  .pf-why-item{display:flex; align-items:flex-start; gap:10px; color:var(--text-muted); font-size:14px; line-height:1.5;}
  .pf-why-item svg{width:18px; height:18px; flex-shrink:0; margin-top:1px; color:var(--gold);}
  @media (max-width:600px){ .pf-why{grid-template-columns:1fr;} }

  /* PRICING */
  .pf-price-line{font-size:18px; color:var(--navy); display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .pf-price-amount{font-family:'Oswald',sans-serif; font-size:28px; font-weight:600; color:var(--gold-dark);}

  /* REVIEWS */
  .pf-review{display:flex; align-items:center; gap:20px;}
  .pf-review-score{font-size:40px; font-weight:700; color:var(--navy); font-family:'Oswald',sans-serif; flex-shrink:0;}
  .pf-review-meta p{margin:0 0 4px;}
  .pf-review-meta .pf-stars{font-size:16px;}
  .pf-review-meta a{color:var(--gold-dark); font-weight:600; text-decoration:underline; font-size:13px;}

  /* PRAKTISK INFORMATION */
  .pf-info-list{max-width:460px;}
  .pf-info-row{display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--chrome-line); font-size:14px;}
  .pf-info-row:last-child{border-bottom:none;}
  .pf-info-row.is-today{font-weight:700; color:var(--navy);}
  .pf-info-label{color:var(--text-muted); flex-shrink:0;}
  .pf-info-value{color:var(--navy); text-align:right; overflow-wrap:anywhere;}

  /* ENTRANCE ANIMATION */
  .pf-hero, .profile-section{
    opacity:0; transform:translateY(10px);
    animation:profile-enter 420ms var(--ease-out) forwards;
  }
  @keyframes profile-enter{to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .pf-hero, .profile-section{animation:none; opacity:1; transform:none;}
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="../../../index.html" class="logo"><span class="logo-prefix">find</span>bilplejere<span class="logo-suffix">.dk</span></a>
    <div class="nav-links">
      <a href="../../../index.html#search">Find en butik</a>
      <a href="../../../index.html#shops">For butikker</a>
    </div>
    <a href="../../../index.html#shops" class="nav-cta">Bliv listet</a>
  </div>
</nav>

<section class="seo-page">
  <div class="wrap pf-wrap">
    <div class="breadcrumb" id="breadcrumb">
      <a href="../../../index.html">Forside</a><span class="sep">/</span>Bilpleje
    </div>

    <div id="shopContent">
      <p class="intro">Henter…</p>
    </div>
  </div>
</section>

<div class="pf-sticky-cta" id="stickyCta" style="display:none;">
  <button class="btn-primary" id="stickyCtaBtn">Få tilbud</button>
</div>

<footer>
  <a href="../../../privatlivspolitik.html">Privatlivspolitik</a> · findbilplejere.dk
</footer>

<div class="modal-overlay" id="leadModal" onclick="if(event.target===this) closeLeadModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeLeadModal()" aria-label="Luk">&times;</button>
    <h3 id="modalShopName">Få tilbud</h3>
      <form class="lead-form" name="kunde-lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="handleCustomerLeadSubmit(event)">
        <input type="hidden" name="form-name" value="kunde-lead">
        <input type="hidden" name="butik" id="modalButikField">
        <p class="hidden-field"><label>Udfyld ikke dette felt hvis du er menneske: <input name="bot-field"></label></p>
        <label class="mono" for="custName">Navn</label>
        <input type="text" name="navn" id="custName" required>
        <label class="mono" for="custContact">Telefon eller mail</label>
        <input type="text" name="kontakt" id="custContact" required>
        <label class="mono" for="custMsg">Hvad skal der ordnes?</label>
        <input type="text" name="besked" id="custMsg" placeholder="Fx keramisk coating på min bil">
        <button type="submit" class="btn-primary" style="width:100%; margin-top:6px;">Send forespørgsel</button>
        <p class="lead-note">Vi videresender din forespørgsel direkte til butikken. Læs vores <a href="../../../privatlivspolitik.html" style="color:inherit; text-decoration:underline;">privatlivspolitik</a>.</p>
      </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../../js/main.js"></script>
<script>
const DAYS_ORDER = [['mandag','Mandag'],['tirsdag','Tirsdag'],['onsdag','Onsdag'],['torsdag','Torsdag'],['fredag','Fredag'],['lørdag','Lørdag'],['søndag','Søndag']];
const JS_DAY_TO_KEY = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];

function toggleAbout(btn){
  const p = btn.previousElementSibling;
  const collapsed = p.classList.toggle('is-clamped') === false;
  btn.textContent = collapsed ? 'Vis mindre' : 'Læs mere';
}

function extractLeadSentence(description, limit = 160){
  const match = description.match(/[.!?](?=\s|$)/);
  if (!match || match.index > limit) return null;
  return description.slice(0, match.index + 1).trim();
}

function infoRow(label, value, extraClass){
  if (!value) return '';
  return `<div class="pf-info-row${extraClass ? ' ' + extraClass : ''}"><span class="pf-info-label">${label}</span><span class="pf-info-value">${value}</span></div>`;
}

async function loadShop(){
  const path = window.location.pathname.replace(/^\//, '');
  const { data: shop, error } = await db.from('shops').select('*').eq('profile_url', path).eq('godkendt', true).maybeSingle();

  const content = document.getElementById('shopContent');
  const breadcrumb = document.getElementById('breadcrumb');

  if (error || !shop) {
    content.innerHTML = '<p class="intro">Denne butiksprofil findes ikke (længere).</p>';
    return;
  }

  db.from('profil_visninger').insert({ butik: shop.name }).then(({ error }) => {
    if (error) console.error('Kunne ikke logge profilvisning', error);
  });

  document.title = shop.name + ' | FindBilplejere.dk';
  const metaDesc = shop.tagline || `${shop.name} tilbyder ${(shop.services || []).slice(0, 3).join(', ')} i ${shop.city}. Se priser og få tilbud direkte.`;
  document.getElementById('metaDescription').setAttribute('content', metaDesc);
  breadcrumb.innerHTML = `
    <a href="/index.html">Forside</a><span class="sep">/</span>
    <a href="/bilpleje/${shop.city_key}/">${shop.city}</a><span class="sep">/</span>${shop.name}
  `;

  const hasReview = shop.review_rating && shop.review_count && shop.review_visible !== false;
  const starsGlyphs = hasReview ? '★★★★★'.slice(0, Math.round(shop.review_rating)) + '☆☆☆☆☆'.slice(0, 5 - Math.round(shop.review_rating)) : '';

  // ---- 1. HERO ----
  const heroImgHtml = shop.hero_image_url
    ? `<img src="${shop.hero_image_url}" alt="${shop.name}" class="pf-hero-img">`
    : `<div class="pf-hero-fallback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><path d="M20 20l-5.5-5.5"/></svg></div>`;
  const heroHtml = `
    <div class="pf-hero">
      <div class="pf-split pf-hero-grid">
        <div class="pf-hero-main">
          <p class="pf-eyebrow">Virksomhedsprofil</p>
          <h1 class="pf-name">${shop.name}</h1>
          <p class="pf-location">${shop.city}${shop.address ? ' · ' + shop.address : ''}</p>
          ${hasReview ? `<p class="pf-stars-row"><span class="pf-stars" role="img" aria-label="${shop.review_rating} ud af 5 stjerner">${starsGlyphs}</span></p>` : ''}
          ${shop.tagline ? `<p class="pf-tagline">${shop.tagline}</p>` : ''}
        </div>
        <div class="pf-hero-media">
          ${heroImgHtml}
          <button class="btn-primary pf-cta-primary" onclick="openLeadModal('${shop.name.replace(/'/g, "\\'")}')">Få tilbud fra ${shop.name}</button>
          <div class="pf-secondary-actions">
            ${shop.phone ? `<a class="pf-secondary-btn" href="tel:${shop.phone.replace(/\s/g,'')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Ring</a>` : ''}
            ${shop.email ? `<a class="pf-secondary-btn" href="mailto:${shop.email}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>E-mail</a>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;

  // ---- 2. OM VIRKSOMHEDEN ----
  let aboutHtml = '';
  if (shop.description) {
    const lead = extractLeadSentence(shop.description);
    const remainder = lead ? shop.description.slice(lead.length).trim() : '';
    const useHeadline = !!(lead && remainder.length > 20);
    aboutHtml = `
      <div class="profile-section pf-split pf-about-grid">
        <div>${useHeadline ? `<h2 class="pf-about-headline">${lead}</h2>` : `<h2 class="pf-about-label">Om ${shop.name}</h2>`}</div>
        <div>
          <p class="pf-about-text is-clamped">${useHeadline ? remainder : shop.description}</p>
          <button class="pf-readmore" onclick="toggleAbout(this)">Læs mere</button>
        </div>
      </div>
    `;
  }

  // ---- 3. NØGLETAL ----
  const stats = [];
  if (hasReview) stats.push({ value: shop.review_rating, label: 'Rating' });
  if (shop.price_from) stats.push({ value: `${shop.price_from} kr.`, label: 'Startpris' });
  if (shop.services && shop.services.length) stats.push({ value: shop.services.length, label: 'Ydelser' });
  const statsHtml = stats.length ? `
    <div class="profile-section">
      <h2 class="sr-only">Nøgletal</h2>
      <div class="pf-stats">${stats.map(s => `<div class="pf-stat"><div class="pf-stat-value">${s.value}</div><div class="pf-stat-label">${s.label}</div></div>`).join('')}</div>
    </div>
  ` : '';

  // ---- 4. DET TILBYDER VI + PRIS (paired side by side on desktop) ----
  const servicesAndPriceHtml = `
    <div class="profile-section pf-split pf-split-top">
      <div>
        <h2>Det tilbyder vi</h2>
        <ul class="pf-services">${shop.services.map(s => `<li class="pf-service-row"><span class="pf-service-name">${s}</span></li>`).join('')}</ul>
      </div>
      <div>
        <h2>Pris</h2>
        <p class="pf-price-line">
          ${shop.price_from ? `Fra <span class="pf-price-amount">${shop.price_from} kr.</span>` : 'Pris fås ved henvendelse'}
          ${shop.discount ? `<span class="pill discount">${shop.discount}% rabat</span>` : ''}
        </p>
      </div>
    </div>
  `;

  // ---- 5. HVORFOR VÆLGE OS ----
  const why = shop.why_choose_us || [];
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
  const whyHtml = why.length ? `
    <div class="profile-section">
      <h2>Hvorfor vælge os?</h2>
      <div class="pf-why">
        ${why.map(item => `<div class="pf-why-item">${checkSvg}<span>${item}</span></div>`).join('')}
      </div>
    </div>
  ` : '';

  // ---- 7 + 9. ANMELDELSER + PRAKTISK INFORMATION (paired side by side when both exist) ----
  const hours = shop.opening_hours || {};
  const todayKey = JS_DAY_TO_KEY[new Date().getDay()];
  const hoursRowsHtml = DAYS_ORDER
    .filter(([key]) => hours[key])
    .map(([key, label]) => infoRow(label, hours[key], key === todayKey ? 'is-today' : ''))
    .join('');
  const infoRowsHtml = [
    infoRow('Adresse', shop.address),
    infoRow('Dækningsområde', shop.coverage_areas),
    hoursRowsHtml,
    infoRow('Telefon', shop.phone),
    infoRow('E-mail', shop.email),
    infoRow('Instagram', shop.instagram ? `<a href="${shop.instagram}" target="_blank" rel="noopener">Se profil</a>` : ''),
    infoRow('Facebook', shop.facebook ? `<a href="${shop.facebook}" target="_blank" rel="noopener">Se profil</a>` : ''),
  ].filter(Boolean).join('');

  const reviewsInner = hasReview ? `
    <h2>Anmeldelser</h2>
    <div class="pf-review">
      <div class="pf-review-score">${shop.review_rating}</div>
      <div class="pf-review-meta">
        <p class="pf-stars">${starsGlyphs}</p>
        <p>${shop.review_count} anmeldelser${shop.review_source ? ' på ' + shop.review_source : ''}</p>
        ${shop.review_url ? `<a href="${shop.review_url}" target="_blank" rel="noopener">Se anmeldelser</a>` : ''}
      </div>
    </div>
  ` : '';
  const infoInner = infoRowsHtml ? `
    <h2>Praktisk information</h2>
    <div class="pf-info-list">${infoRowsHtml}</div>
  ` : '';

  let reviewsInfoHtml = '';
  if (hasReview && infoRowsHtml) {
    reviewsInfoHtml = `<div class="profile-section pf-split pf-split-top"><div>${reviewsInner}</div><div>${infoInner}</div></div>`;
  } else if (hasReview || infoRowsHtml) {
    reviewsInfoHtml = `<div class="profile-section">${reviewsInner}${infoInner}</div>`;
  }

  content.innerHTML = heroHtml + aboutHtml + statsHtml + servicesAndPriceHtml + whyHtml + reviewsInfoHtml;

  // Sticky mobile CTA
  const stickyCta = document.getElementById('stickyCta');
  const stickyCtaBtn = document.getElementById('stickyCtaBtn');
  stickyCtaBtn.textContent = 'Få tilbud fra ' + shop.name;
  stickyCtaBtn.onclick = () => openLeadModal(shop.name);
  stickyCta.style.display = '';
  document.body.classList.add('has-sticky-cta');
}
loadShop();
</script>

</body>
</html>
