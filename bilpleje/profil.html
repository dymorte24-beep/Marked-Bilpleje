<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bilpleje-butik | Bilpleje.dk</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../css/style.css">
<style>
  .profile-header{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; justify-content:space-between;}
  .profile-header-text{flex:1; min-width:240px;}
  .hero-img{width:260px; height:260px; object-fit:cover; border-radius:10px; flex-shrink:0; border:1px solid var(--chrome-line);}
  .tagline{color:#3A4150; font-size:17px; margin:6px 0 0;}
  .profile-section{margin-top:32px; padding-top:24px; border-top:1px solid var(--chrome-line);}
  .profile-section h2{font-size:18px; margin-bottom:10px;}
  .why-list{list-style:none; padding:0;}
  .why-list li{padding:4px 0; color:#3A4150;}
  .hours-list{max-width:280px;}
  .hours-item{display:flex; justify-content:space-between; padding:4px 0; font-size:14px; border-bottom:1px solid var(--chrome-line);}
  .hours-item:last-child{border-bottom:none;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="../../../index.html" class="logo">bilpleje<span>.dk</span></a>
    <div class="nav-links">
      <a href="../../../index.html#search">Find en butik</a>
      <a href="../../../index.html#shops">For butikker</a>
    </div>
    <a href="../../../index.html#shops" class="nav-cta">Bliv listet</a>
  </div>
</nav>

<section class="seo-page">
  <div class="wrap">
    <div class="breadcrumb" id="breadcrumb">
      <a href="../../../index.html">Forside</a><span class="sep">/</span>Bilpleje
    </div>

    <div id="shopContent">
      <p class="intro">Henter…</p>
    </div>
  </div>
</section>

<footer>
  <a href="../../../privatlivspolitik.html">Privatlivspolitik</a> · bilpleje.dk — prototype
</footer>

<div class="modal-overlay" id="leadModal" onclick="if(event.target===this) closeLeadModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeLeadModal()" aria-label="Luk">&times;</button>
    <h3 id="modalShopName">Få tilbud</h3>
      <form class="lead-form" name="kunde-lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="handleCustomerLeadSubmit(event)">
        <input type="hidden" name="form-name" value="kunde-lead">
        <input type="hidden" name="butik" id="modalButikField">
        <p class="hidden-field"><label>Udfyld ikke dette felt hvis du er menneske: <input name="bot-field"></label></p>
        <label class="mono" for="custName">Navn</label>
        <input type="text" name="navn" id="custName" required>
        <label class="mono" for="custContact">Telefon eller mail</label>
        <input type="text" name="kontakt" id="custContact" required>
        <label class="mono" for="custMsg">Hvad skal der ordnes?</label>
        <input type="text" name="besked" id="custMsg" placeholder="Fx keramisk coating på min bil">
        <button type="submit" class="btn-primary" style="width:100%; margin-top:6px;">Send forespørgsel</button>
        <p class="lead-note">Vi videresender din forespørgsel direkte til butikken. Læs vores <a href="../../../privatlivspolitik.html" style="color:inherit; text-decoration:underline;">privatlivspolitik</a>.</p>
      </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../../js/main.js"></script>
<script>
const DAYS_ORDER = [['mandag','Mandag'],['tirsdag','Tirsdag'],['onsdag','Onsdag'],['torsdag','Torsdag'],['fredag','Fredag'],['lørdag','Lørdag'],['søndag','Søndag']];

async function loadShop(){
  const path = window.location.pathname.replace(/^\//, '');
  const { data: shop, error } = await db.from('shops').select('*').eq('profile_url', path).eq('godkendt', true).maybeSingle();

  const content = document.getElementById('shopContent');
  const breadcrumb = document.getElementById('breadcrumb');

  if (error || !shop) {
    content.innerHTML = '<p class="intro">Denne butiksprofil findes ikke (længere).</p>';
    return;
  }

  db.from('profil_visninger').insert({ butik: shop.name }).then(({ error }) => {
    if (error) console.error('Kunne ikke logge profilvisning', error);
  });

  document.title = shop.name + ' | Bilpleje.dk';
  breadcrumb.innerHTML = `
    <a href="/index.html">Forside</a><span class="sep">/</span>
    <a href="/bilpleje/${shop.city_key}/">${shop.city}</a><span class="sep">/</span>${shop.name}
  `;

  const hours = shop.opening_hours || {};
  const hoursEntries = DAYS_ORDER.filter(([key]) => hours[key]);
  const hoursHtml = hoursEntries.length ? `
    <div class="profile-section">
      <h2>Åbningstider</h2>
      <div class="hours-list">
        ${hoursEntries.map(([key, label]) => `<div class="hours-item"><span>${label}</span><span>${hours[key]}</span></div>`).join('')}
      </div>
    </div>
  ` : '';

  const why = shop.why_choose_us || [];
  const whyHtml = why.length ? `
    <div class="profile-section">
      <h2>Hvorfor vælge os?</h2>
      <ul class="why-list">${why.map(item => `<li>✓ ${item}</li>`).join('')}</ul>
    </div>
  ` : '';

  const socialLinks = [];
  if (shop.instagram) socialLinks.push(`<a href="${shop.instagram}" target="_blank" rel="noopener">Instagram</a>`);
  if (shop.facebook) socialLinks.push(`<a href="${shop.facebook}" target="_blank" rel="noopener">Facebook</a>`);
  const socialHtml = socialLinks.length ? `<div class="profile-section"><h2>Følg os</h2><p>${socialLinks.join(' · ')}</p></div>` : '';

  content.innerHTML = `
    <div class="profile-header">
      <div class="profile-header-text">
        <h1>${shop.name}</h1>
        <p class="intro">${shop.city}${shop.address ? ' · ' + shop.address : ''}</p>
        ${shop.tagline ? `<p class="tagline">${shop.tagline}</p>` : ''}
        <div class="card-tags" style="margin:16px 0 20px;">
          ${shop.verificeret ? `<span class="pill verified">Verificeret</span>` : ''}
          ${shop.price_from ? `<span class="pill">Fra ${shop.price_from} kr.</span>` : ''}
          ${shop.discount ? `<span class="pill discount">${shop.discount}% rabat</span>` : ''}
        </div>
        <button class="btn-primary" onclick="openLeadModal('${shop.name.replace(/'/g, "\\'")}')">Få tilbud fra ${shop.name}</button>
      </div>
      ${shop.hero_image_url ? `<img src="${shop.hero_image_url}" alt="${shop.name}" class="hero-img">` : ''}
    </div>

    ${shop.description ? `<div class="profile-section"><h2>Om ${shop.name}</h2><p>${shop.description}</p></div>` : ''}

    <div class="profile-section">
      <h2>Ydelser</h2>
      <p>${shop.services.join(', ')}</p>
    </div>

    ${whyHtml}
    ${shop.coverage_areas ? `<div class="profile-section"><h2>Område</h2><p>${shop.coverage_areas}</p></div>` : ''}
    ${hoursHtml}
    ${socialHtml}
  `;
}
loadShop();
</script>

</body>
</html>
